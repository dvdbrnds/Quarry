name: BirdDog
options:
  bundleIdPrefix: edu.moravian
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: BirdDog/App/Info.plist
    GENERATE_INFOPLIST_FILE: false
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      GCC_OPTIMIZATION_LEVEL: s
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      GCC_OPTIMIZATION_LEVEL: s
packages:
  StarXpand-SDK-iOS:
    url: https://github.com/star-micronics/StarXpand-SDK-iOS
    from: "2.6.0"
targets:
  BirdDog:
    type: application
    platform: iOS
    sources:
      - path: BirdDog
        excludes:
          - "BirdDog-graphic design-Assets/**"
          - "**/*.xlsx"
    resources:
      - path: BirdDog/Resources/Assets.xcassets
      - path: BirdDog/Resources/lots.json
      - path: BirdDog/App/PrivacyInfo.xcprivacy
    dependencies:
      - package: StarXpand-SDK-iOS
        product: StarIO10
      - sdk: ExternalAccessory.framework
    entitlements:
      path: BirdDog/App/BirdDog.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.moravian.birddog
        MARKETING_VERSION: "2.1.0"
        CURRENT_PROJECT_VERSION: "3"
        DEVELOPMENT_TEAM: P6D8DZ6BZ7
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTED_INTERFACE_ORIENTATIONS: "UIInterfaceOrientationPortrait"
        SUPPORTED_INTERFACE_ORIENTATIONS~ipad: "UIInterfaceOrientationPortrait"
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_IDENTITY: "Apple Development"

  BirdDogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BirdDogTests
    dependencies:
      - target: BirdDog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.moravian.birddog.tests
        DEVELOPMENT_TEAM: P6D8DZ6BZ7
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BirdDog.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BirdDog"
        BUNDLE_LOADER: "$(TEST_HOST)"
